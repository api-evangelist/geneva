name: Geneva
description: 'Geneva is an all-in-one communication app for groups, clubs, and communities
  — "the online place to find your offline people." It bundles full-featured group
  chat (threaded replies, reactions, GIFs, attachments, polls, pins), audio/video
  rooms and livestreaming for hundreds of viewers, event planning, and wallet-connect
  with token-gated rooms for tokenized communities. Geneva ships as free iOS, Android,
  and web apps and was acquired by Bumble Inc. This API Evangelist profile entered
  the network as a VC-portfolio-sourced stub; the company publishes a consumer app
  with no public developer API, OpenAPI, SDK, or documentation surface as of this
  enrichment pass.'
